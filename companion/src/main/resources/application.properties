# The companion listens where the single-file service does: this machine, port 5190. A launch
# argument (--port=, --host=) overrides these as it does there.
server.address=127.0.0.1
server.port=5190
# A request body is read by the service itself, which holds the same 64 MB limit the single-file
# service does; Tomcat's form-post limit does not apply, and its swallow limit is raised so that a
# body refused over the limit is still drained rather than reset.
server.tomcat.max-swallow-size=64MB
# Reasoning as jobs (roadmap 3.3, TD-14): one job at a time, four waiting, and a request refused
# with "busy" rather than queued beyond that. A job may ask for its own timeout within the
# maximum; the answer says the timeout and heap it was worked out under. The last 16 answers are
# kept, by content and reasoner, and reused until that content changes.
conceptweaver.reasoning.workers=1
conceptweaver.reasoning.queue=4
conceptweaver.reasoning.timeout-ms=60000
conceptweaver.reasoning.max-timeout-ms=600000
conceptweaver.reasoning.cache=16
# Ontology sessions (roadmap 3.4): the last uploaded ontologies are held by content hash, the
# least recently asked of going first. Holding is bounded: these are the bridge to Phase 4, not a
# store.
conceptweaver.sessions.cache=8
# A job's answer is waited for by its request (POST /reasoning/result), which may take the longest
# a job may run plus what it takes to stop it; Tomcat would otherwise end the request at 30 s.
spring.mvc.async.request-timeout=660000
# ELK tells its logger what it left out while it works, and each such call also records that the
# monitor has said its piece; the next call with the same monitor then stays silent. In the
# single-file service SLF4J had no binding, so those calls did nothing at all. Spring Boot has a
# binding, which would leave /reason with only part of ELK's account of itself; its logging is
# turned off here, and the answer asks the monitors instead, once, in the same words the single-file
# service printed.
logging.level.org.semanticweb.elk=OFF
