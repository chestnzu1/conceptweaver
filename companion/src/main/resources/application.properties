# The companion listens where the single-file service does: this machine, port 5190. A launch
# argument (--port=, --host=) overrides these as it does there.
server.address=127.0.0.1
server.port=5190
# A request body is read by the service itself, which holds the same 64 MB limit the single-file
# service does; Tomcat's form-post limit does not apply, and its swallow limit is raised so that a
# body refused over the limit is still drained rather than reset.
server.tomcat.max-swallow-size=64MB
# ELK tells its logger what it left out while it works, and each such call also records that the
# monitor has said its piece; the next call with the same monitor then stays silent. In the
# single-file service SLF4J had no binding, so those calls did nothing at all. Spring Boot has a
# binding, which would leave /reason with only part of ELK's account of itself; its logging is
# turned off here, and the answer asks the monitors instead, once, in the same words the single-file
# service printed.
logging.level.org.semanticweb.elk=OFF
